name: CI

on:
  push:
    branches: [ main, feat/flutter-integration ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || [ -d datumagro ]; then
            pytest -q || true
          else
            echo 'No pytest tests found; skipping.'
          fi

      - name: Run Bandit (security scan)
        run: |
          pip install bandit
          bandit -r . || true

      - name: Build Docker image (optional push)
        env:
          IMAGE_NAME: datumagro/app
        run: |
          docker build -t $IMAGE_NAME:latest .
          echo "Docker image built: $IMAGE_NAME:latest"

  deploy:
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/datumagro:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/datumagro:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/datumagro:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/datumagro:buildcache,mode=max
