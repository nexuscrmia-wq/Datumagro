name: CI — Django Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Railway auto-deploya via push-to-deploy (monitorando o repo diretamente).
# Este workflow só faz CI (verifica que o código está íntegro antes do deploy).

jobs:
  check:
    name: Django system check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: datumagro.settings
          SECRET_KEY: ci-check-only-not-real
          DATABASE_URL: sqlite:///tmp_ci.db
          DEBUG: "False"
          ENVIRONMENT: production
