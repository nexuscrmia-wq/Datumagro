name: CI + Deploy → Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: CI + Deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # clone completo — railway up precisa do histórico git

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: |
          python manage.py check --deploy 2>&1 | grep -v "WARNINGS\|?: " || true
        env:
          DJANGO_SETTINGS_MODULE: datumagro.settings
          SECRET_KEY: ci-check-only-not-real
          DATABASE_URL: sqlite:///tmp_ci.db

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --service datumagro-web --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
