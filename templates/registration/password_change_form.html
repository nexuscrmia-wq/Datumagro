{% raw %}
{% extends 'base.html' %}

{% block title %}Alterar Senha - DatumAgro{% endblock %}

{% block content %}
    <div class="form-container" style="max-width: 500px; margin: auto;">
        <h2>Alterar Minha Senha</h2>
        <p>Preencha o formulário abaixo para definir uma nova senha de acesso.</p>

        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="button-primary" style="width: 100%;">Salvar Nova Senha</button>
        </form>
    </div>
{% endblock %}
{% endraw %}
