[build]
builder = "nixpacks"

[deploy]
# migrate roda antes do gunicorn (padrão Django em produção).
# startup_check loga avisos sem travar se env vars opcionais estiverem faltando.
# seed_guias NÃO está aqui — rodar manualmente uma única vez:
#   railway run python manage.py seed_guias
startCommand = "python manage.py migrate --noinput && python manage.py startup_check && gunicorn datumagro.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --worker-class sync --timeout 60 --access-logfile -"
healthcheckPath = "/ping/"
healthcheckTimeout = 120
