name: datumagro_mobile
description: "Cliente Flutter offline-first para DatumAgro (MVP)"
version: 1.5.0+6
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  connectivity_plus: ^4.0.0
  drift: any
  drift_flutter: any
  path_provider: ^2.0.15
  provider: ^6.0.5
  flutter_secure_storage: ^8.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.0
  # Scanner QR/barcode — inclui ML Kit (libbarhopper_v3, libimage_processing_util_jni, libsurface_util_jni)
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  drift_dev: any
  flutter_lints: ^2.0.0
  sqlite3_flutter_libs: any
  flutter_launcher_icons: ^0.14.1

# Geração automática de ícones do app — rode: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_datumagro.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#16241c"
  adaptive_icon_foreground: "assets/images/logo_datumagro.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/banner_datumagro.jpeg
    - assets/images/logo_datumagro.jpeg
